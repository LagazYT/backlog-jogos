name: Gerar APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Falta o segredo KEYSTORE_PASS em Settings > Secrets and variables > Actions"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/release.jks.enc -out app/release.jks -pass env:KEYSTORE_PASS

      - name: Compilar APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          N=${{ github.run_number }}
          echo "window.APP_VERSION = { tag: \"v1.7.$N\", build: $N };" > app/src/main/assets/www/version.js
          ./gradlew --no-daemon assembleRelease -Pvc=$N -Pvn=1.7.$N 2>&1 | tee build.log | tail -40; test ${PIPESTATUS[0]} -eq 0 || { grep -E -A8 "What went wrong|error:" build.log | sed 's/^/::error::/' | head -20; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk Zerei.apk
          # Cópia com o nome antigo, para o link de download antigo continuar funcionando
          cp Zerei.apk Backlog.apk
          rm -f app/release.jks

      - name: Guardar o APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Zerei-apk
          path: Zerei.apk

      - name: Publicar na página de Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.${{ github.run_number }}
          name: Zerei 1.7.${{ github.run_number }}
          files: |
            Zerei.apk
            Backlog.apk
          body: ${{ github.event.head_commit.message }}
