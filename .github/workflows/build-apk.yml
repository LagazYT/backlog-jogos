name: Gerar APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK
        run: |
          chmod +x gradlew
          N=${{ github.run_number }}
          echo "window.APP_VERSION = { tag: \"v1.3.$N\", build: $N };" > app/src/main/assets/www/version.js
          ./gradlew --no-daemon assembleRelease -Pvc=$N -Pvn=1.3.$N
          cp app/build/outputs/apk/release/app-release.apk Backlog.apk

      - name: Guardar o APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Backlog-apk
          path: Backlog.apk

      - name: Publicar na página de Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: Backlog 1.3.${{ github.run_number }}
          files: Backlog.apk
          body: ${{ github.event.head_commit.message }}
