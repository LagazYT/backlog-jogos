name: Probe
on:
  push:
    branches: [ probe5 ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p probe
          python3 - <<'PY' > probe/result.txt 2>&1 || true
          import json, re, urllib.request, urllib.error
          UA = "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          def get(url, data=None, headers=None):
              h = {"User-Agent": UA, **(headers or {})}
              req = urllib.request.Request(url, data=data, headers=h, method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=25) as r: return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e: return e.code, e.read().decode("utf-8", "replace")
              except Exception as e: return 0, str(e)
          st, home = get("https://howlongtobeat.com/")
          scripts = re.findall(r'src="(/_next/static/[^"]+\.js)"', home)
          for sc in scripts:
              st, js = get("https://howlongtobeat.com" + sc)
              i = js.find('"/api/search/site"')
              if i > 0:
                  print("PAYLOAD", js[max(0, i - 1800):i + 40]); break
          st, b = get(f"https://howlongtobeat.com/api/search/site/init?t=1", headers={"Referer": "https://howlongtobeat.com/"})
          print("init", st, b[:200])
          tok = json.loads(b).get("token") if st == 200 else None
          def search(terms, page=1, rmin=None, rmax=None, sort="popular"):
              payload = {"searchType": "games", "searchTerms": terms, "searchPage": page, "size": 20,
                  "searchOptions": {"games": {"userId": 0, "platform": "", "sortCategory": sort, "rangeCategory": "main",
                      "rangeTime": {"min": rmin, "max": rmax}, "gameplay": {"perspective": "", "flow": "", "genre": "", "difficulty": ""},
                      "rangeYear": {"min": "", "max": ""}, "modifier": ""}, "users": {"sortCategory": "postcount"}, "lists": {"sortCategory": "follows"},
                      "filter": "", "sort": 0, "randomizer": 0}, "useCache": True}
              return get("https://howlongtobeat.com/api/search/site", data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json", "x-auth-token": tok or "", "Referer": "https://howlongtobeat.com/", "Origin": "https://howlongtobeat.com"})
          def search2(platform):
              payload = {"searchType": "games", "searchTerms": [], "searchPage": 1, "size": 20,
                  "searchOptions": {"games": {"userId": 0, "platform": platform, "sortCategory": "popular", "rangeCategory": "main",
                      "rangeTime": {"min": None, "max": None}, "gameplay": {"perspective": {"mode": "include", "values": []}, "flow": {"mode": "include", "values": []}, "genre": {"mode": "include", "values": []}},
                      "year": {"mode": "include", "values": []}, "modifier": ""}, "users": {"sortCategory": "postcount"}, "lists": {"sortCategory": "follows"},
                      "filter": "", "sort": 0, "randomizer": 0}, "useCache": True}
              return get("https://howlongtobeat.com/api/search/site", data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json", "x-auth-token": tok or "", "Referer": "https://howlongtobeat.com/", "Origin": "https://howlongtobeat.com"})
          for plat in [{"mode": "include", "values": ["Nintendo Switch 2"]}, {"mode": "include", "values": ["PlayStation 5"]}, "Nintendo Switch 2", {"mode": "include", "values": []}]:
              st, b = search2(plat)
              try:
                  j = json.loads(b); print("PLAT", json.dumps(plat), st, j.get("count"), [(d["game_name"], d["profile_platform"][:60], d["comp_lvl_sp"], d["game_type"]) for d in j["data"][:4]])
              except Exception: print("PLAT", plat, st, b[:200])
          for u in ["https://howlongtobeat.com/games/26286_Hollow_Knight.jpg?width=250", "https://howlongtobeat.com/games/26286_Hollow_Knight.jpg"]:
              req = urllib.request.Request(u, headers={"User-Agent": UA})
              try:
                  r = urllib.request.urlopen(req, timeout=20); print("IMG", u, r.status, r.headers.get("Content-Type"), len(r.read()))
              except Exception as e: print("IMG", u, e)
          st, b = get("https://store.steampowered.com/search/results/?query=&start=0&count=10&category1=998&category2=2&filter=mostplayed&infinite=1&cc=BR&l=portuguese")
          j = json.loads(b); print("STEAM", j.get("total_count"), re.findall(r'<span class="title">([^<]+)</span>', j["results_html"])[:10])
          print("ROW", j["results_html"][:1500])
          PY
          cat probe/result.txt
          git config user.name probe; git config user.email probe@example.com
          git add probe && git commit -m probe && git push
