plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lagaz.backlog'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lagaz.backlog'
        minSdk 26
        targetSdk 34
        versionCode((project.findProperty('vc') ?: '4').toInteger())
        versionName((project.findProperty('vn') ?: '1.3').toString())
    }

    // A chave de assinatura nunca fica no repositório em texto puro.
    // O GitHub Actions decripta app/release.jks.enc com o segredo KEYSTORE_PASS.
    def keystorePass = System.getenv('KEYSTORE_PASS')
    def releaseKey = file('release.jks')

    signingConfigs {
        release {
            if (keystorePass && releaseKey.exists()) {
                storeFile releaseKey
                storePassword keystorePass
                keyAlias 'backlog'
                keyPassword keystorePass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sem a senha (build local), assina com a chave de debug do próprio Android Studio
            signingConfig (keystorePass && releaseKey.exists()) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
