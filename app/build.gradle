plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lagaz.backlog'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lagaz.backlog'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.1.1"
    }

    signingConfigs {
        release {
            storeFile file('backlog.keystore')
            storePassword 'backlog123'
            keyAlias 'backlog'
            keyPassword 'backlog123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
