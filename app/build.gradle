plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lagaz.backlog'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lagaz.backlog'
        minSdk 26
        targetSdk 34
        versionCode((project.findProperty('vc') ?: '4').toInteger())
        versionName((project.findProperty('vn') ?: '1.3').toString())
    }

    signingConfigs {
        release {
            storeFile file('backlog.keystore')
            storePassword 'backlog123'
            keyAlias 'backlog'
            keyPassword 'backlog123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
